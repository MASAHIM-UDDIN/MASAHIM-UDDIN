<svg width="900" height="100" viewBox="0 0 900 100"
     xmlns="http://www.w3.org/2000/svg">

  <style>
    .word {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 38px;
      font-weight: 700;
      fill: #24292f;
      opacity: 0;
    }

    .w1 { animation: word1 8s infinite; }
    .w2 { animation: word2 8s infinite; }
    .w3 { animation: word3 8s infinite; }
    .w4 { animation: word4 8s infinite; }
    .w5 { animation: word5 8s infinite; }
    .w6 { animation: word6 8s infinite; }

    @keyframes word1 {
      0%, 4%   { opacity: 0; transform: translateY(10px); }
      8%, 78%  { opacity: 1; transform: translateY(0); }
      88%,100% { opacity: 0; transform: translateY(-10px); }
    }

    @keyframes word2 {
      0%, 12%  { opacity: 0; transform: translateY(10px); }
      16%, 78% { opacity: 1; transform: translateY(0); }
      88%,100% { opacity: 0; transform: translateY(-10px); }
    }

    @keyframes word3 {
      0%, 20%  { opacity: 0; transform: translateY(10px); }
      24%, 78% { opacity: 1; transform: translateY(0); }
      88%,100% { opacity: 0; transform: translateY(-10px); }
    }

    @keyframes word4 {
      0%, 28%  { opacity: 0; transform: translateY(10px); }
      32%, 78% { opacity: 1; transform: translateY(0); }
      88%,100% { opacity: 0; transform: translateY(-10px); }
    }

    @keyframes word5 {
      0%, 36%  { opacity: 0; transform: translateY(10px); }
      40%, 78% { opacity: 1; transform: translateY(0); }
      88%,100% { opacity: 0; transform: translateY(-10px); }
    }

    @keyframes word6 {
      0%, 44%  { opacity: 0; transform: translateY(10px); }
      48%, 78% { opacity: 1; transform: translateY(0); }
      88%,100% { opacity: 0; transform: translateY(-10px); }
    }

    @media (prefers-color-scheme: dark) {
      .word {
        fill: #f0f6fc;
      }
    }
  </style>

  <text x="20"  y="62" class="word w1">👋</text>
  <text x="72"  y="62" class="word w2">Hello,</text>
  <text x="210" y="62" class="word w3">I'm</text>
  <text x="285" y="62" class="word w4">Muhammad</text>
  <text x="525" y="62" class="word w5">Masahim</text>
  <text x="720" y="62" class="word w6">Uddin</text>

</svg>
